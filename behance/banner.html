*{margin:0;padding:0;box-sizing:border-box}
html,body{width:3200px;height:410px;overflow:hidden;background:#080a0e}
body{font-family:'Unbounded',sans-serif;color:#e8e4dc;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,255,170,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,170,.07) 1px,transparent 1px);background-size:41px 41px;
 mask-image:radial-gradient(ellipse 55% 120% at 50% 50%,#000 30%,transparent 80%)}
.glow{position:absolute;border-radius:50%;filter:blur(110px)}
.g1{width:900px;height:420px;background:rgba(0,255,170,.20);left:1150px;top:-220px}
.g2{width:700px;height:380px;background:rgba(124,92,255,.22);left:1700px;bottom:-260px}
.g3{width:500px;height:300px;background:rgba(0,255,170,.10);left:600px;bottom:-220px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:1500px}
.tag{font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.24em;color:#00ffaa;text-transform:uppercase;display:inline-flex;align-items:center;gap:14px;margin-bottom:22px}
.tag i{width:10px;height:10px;border-radius:50%;background:#00ffaa;box-shadow:0 0 16px #00ffaa}
h1{font-size:92px;font-weight:800;line-height:1;letter-spacing:-.02em;white-space:nowrap}
h1 em{font-style:normal;color:#00ffaa}
.sub{font-family:'JetBrains Mono',monospace;font-size:22px;color:#a9b0b8;margin-top:26px;letter-spacing:.04em}
.sub b{color:#00ffaa;font-weight:400;margin:0 14px}
/* film strip side decoration */
.strip{position:absolute;top:50%;transform:translateY(-50%);display:flex;gap:18px}
.strip.l{left:260px}.strip.r{right:260px}
.fr{width:120px;height:150px;border:1.5px solid rgba(0,255,170,.25);border-radius:10px;position:relative;background:rgba(8,10,14,.5)}
.fr::after{content:attr(data-n);position:absolute;bottom:8px;right:10px;font-family:'JetBrains Mono';font-size:13px;color:rgba(0,255,170,.55)}
.fr svg{position:absolute;inset:0;margin:auto}
.strip .fr:nth-child(1){opacity:.35}.strip .fr:nth-child(2){opacity:.6}.strip .fr:nth-child(3){opacity:.9}
.strip.r .fr:nth-child(1){opacity:.9}.strip.r .fr:nth-child(3){opacity:.35}
